# DesignCraft 的 OTools 插件 native 适配层。
#
# 上游 `crates/mcp` 已经有完整的 headless 后端（进程内 Session，无窗口），
# 依赖里没有 eframe/wgpu。本 crate 只做两件事：
#   1. 把上游 `tool_definitions()` 转成宿主契约的 { tools: [...] }
#   2. 把宿主传入的 { name, arguments } 转成上游 `call_tool(&mut Headless, ...)`
# 业务逻辑一律复用上游，不在此重写。
#
# 与 `shell/` 一样是**独立 workspace**：上游 workspace 是 wasm/desktop 导向，
# 并进来会让宿主的 cargo build 也去编译 UI 依赖。
[package]
name = "otools-designcraft-native"
description = "DesignCraft as an OTools plugin: headless MCP backend over the upstream designcraft-mcp crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_designcraft_native"

[dependencies]
designcraft-mcp = { path = "../upstream/crates/mcp" }
serde_json = "1"

# 上游 workspace 里的 `[patch.crates-io]` **不会**跟着 path 依赖带过来：补丁只在
# 发起构建的那个 workspace 根节点生效。少了这一段，designcraft-render 与 craft-pdf
# 会因为 hayro / krilla 的未打补丁版本而编译失败（实测）。上游更新后要同步这里
# —— 见 AGENTS.md。hayro 系列从上游 v0.13.0 起改由 craft-libs 提供。
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.8.2" }
winit = { git = "https://github.com/storytold/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }
hayro = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.7.1" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.7.0" }
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.3.0" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "9f75d3dc19b4b514c4f3d4847ed1ec1b0e86b4ef", version = "=0.1.0" }

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
