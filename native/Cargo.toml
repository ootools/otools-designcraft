# DesignCraft 的 OTools 插件 native 适配层。
#
# 上游 `crates/mcp` 已经有完整的 headless 后端（进程内 Session，无窗口），
# 依赖里没有 eframe/wgpu。本 crate 只做两件事：
#   1. 把上游 `tool_definitions()` 转成宿主契约的 { tools: [...] }
#   2. 把宿主传入的 { name, arguments } 转成上游 `call_tool(&mut Headless, ...)`
# 业务逻辑一律复用上游，不在此重写。
#
# 与 `shell/` 一样是**独立 workspace**：上游 workspace 是 wasm/desktop 导向，
# 并进来会让宿主的 cargo build 也去编译 UI 依赖。
[package]
name = "otools-designcraft-native"
description = "DesignCraft as an OTools plugin: headless MCP backend over the upstream designcraft-mcp crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
name = "otools_designcraft_native"

[dependencies]
designcraft-mcp = { path = "../upstream/crates/mcp" }
serde_json = "1"

# 上游 workspace 里的 `[patch.crates-io]` **不会**跟着 path 依赖带过来：
# 补丁只在发起构建的那个 workspace 根节点生效。少了这一段，designcraft-render
# 会因为 hayro 与 winit 的未打补丁版本而链接失败（实测）。上游更新后要同步这里
# —— 见 AGENTS.md。
[patch.crates-io]
winit = { git = "https://github.com/skylartaylor/winit.git", rev = "3d51077fd1a966f84df9ef287839dc84fd5b4ca7" }
# craft-pdf 要求 krilla 带上游 vendor/krilla 的补丁标记（CRAFT_UNWIND_POISONING）。
krilla = { git = "https://github.com/storytold/craft-libs", rev = "c3487320b2d1de657b860b3c8abb44e1f2b32bd8", version = "=0.8.2" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "b5467d93a0ffaa5e5e6658bccdf8655a3ba689c9" }

# cdylib 必须可 unwind：插件 FFI 边界在插件内部捕获 panic，
# 若 release profile 设成 abort，宿主会整体被杀（见主仓 ot-plugin-ffi 的说明）。
[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 16
